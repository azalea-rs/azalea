[build]
rustflags = ["--cfg", "docsrs_dep"]
rustdocflags = [
    "--html-after-content",
    "docs-rs/trait-tags.html",
    "--html-after-content",
    "docs-rs/arborium-header.html",
    "--cfg",
    "docsrs_dep",
]

[unstable]
rustdoc-scrape-examples = true

[registry]
# attempt to mitigate supply chain attacks
global-min-publish-age = "3 days"
