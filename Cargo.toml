[workspace]
members = [
    "azalea",
    "azalea-auth",
    "azalea-block",
    "azalea-brigadier",
    "azalea-buf",
    "azalea-chat",
    "azalea-client",
    "azalea-codec",
    "azalea-core",
    "azalea-crypto",
    "azalea-entity",
    "azalea-inventory",
    "azalea-language",
    "azalea-physics",
    "azalea-protocol",
    "azalea-protocol/fuzz",
    "azalea-registry",
    "azalea-world",
]
resolver = "3"

# --- Workspace Settings ---

[workspace.package]
version = "0.16.0+mc26.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/azalea-rs/azalea"
# homepage = "https://github.com/azalea-rs/azalea"

[workspace.dependencies]
aes = "0.9.4"
async-compat = "0.2.7"
base64 = "0.23.1"
bevy_app = "0.20.1"
bevy_ecs = { version = "0.20.1", default-features = false, features = [
    "multi_threaded",
] }
bevy_utils = { version = "0.20.1", default-features = false }
bevy_log = "0.20.1"
bevy_tasks = "0.20.1"
bevy_time = "0.20.1"
byteorder = "1.5.0"
cfb8 = "0.9.1"
chrono = { version = "0.4.45", default-features = false }
compact_str = "0.10.0"
crc32c = "0.6.9"
criterion = "0.8.2"
derive_more = "2.1.1"
enum-as-inner = "0.7.0"
env_logger = "0.11.11"
eyre = "0.6.14"
flate2 = { version = "1.1.11", features = ["zlib-rs"] }
futures = "0.3.34"
futures-lite = "2.6.1"
hickory-resolver = "0.26.3"
indexmap = "2.14.2"
md-5 = "0.11.0"
minecraft_folder_path = "0.1.2"
nohash-hasher = "0.2.0"
num-bigint = "0.5.1"
num-format = "0.4.4"
num-traits = "0.2.19"
parking_lot = "0.13.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rsa = "0.10.0"
rsa_public_encrypt_pkcs1 = "0.4.0"
rustc-hash = "2.1.3"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
simd-json = "0.19.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
simdnbt = "0.10.0"
# simdnbt = { git = "https://github.com/azalea-rs/simdnbt" }
socks5-impl = "0.10.3"
syn = "3.0.10"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.29.1"
radix-heap = "0.4.2"

azalea-block-macros = { path = "azalea-block/azalea-block-macros", version = "0.16.0", default-features = false }
azalea-block = { path = "azalea-block", version = "0.16.0", default-features = false }
azalea-auth = { path = "azalea-auth", version = "0.16.0", default-features = false }
azalea-brigadier = { path = "azalea-brigadier", version = "0.16.0", default-features = false }
azalea-buf-macros = { path = "azalea-buf/azalea-buf-macros", version = "0.16.0", default-features = false }
azalea-buf = { path = "azalea-buf", version = "0.16.0", default-features = false }
azalea-chat = { path = "azalea-chat", version = "0.16.0", default-features = false }
azalea-client = { path = "azalea-client", version = "0.16.0", default-features = false }
azalea-codec = { path = "azalea-codec", version = "0.16.0", default-features = false }
azalea-codec-macros = { path = "azalea-codec/azalea-codec-macros", version = "0.16.0", default-features = false }
azalea-core = { path = "azalea-core", version = "0.16.0", default-features = false }
azalea-crypto = { path = "azalea-crypto", version = "0.16.0", default-features = false }
azalea-entity = { path = "azalea-entity", version = "0.16.0", default-features = false }
azalea-inventory-macros = { path = "azalea-inventory/azalea-inventory-macros", version = "0.16.0", default-features = false }
azalea-inventory = { path = "azalea-inventory", version = "0.16.0", default-features = false }
azalea-language = { path = "azalea-language", version = "0.16.0", default-features = false }
azalea-physics = { path = "azalea-physics", version = "0.16.0", default-features = false }
azalea-protocol-macros = { path = "azalea-protocol/azalea-protocol-macros", version = "0.16.0", default-features = false }
azalea-protocol = { path = "azalea-protocol", version = "0.16.0", default-features = false }
azalea-registry-macros = { path = "azalea-registry/azalea-registry-macros", version = "0.16.0", default-features = false }
azalea-registry = { path = "azalea-registry", version = "0.16.0", default-features = false }
azalea-registry-builtin = { path = "azalea-registry/azalea-registry-builtin", version = "0.16.0", default-features = false }
azalea-world = { path = "azalea-world", version = "0.16.0", default-features = false }

[workspace.lints.clippy]
# https://users.rust-lang.org/t/to-string-vs-to-owned-for-string-literals/1441
str_to_string = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(docsrs_dep)',
    'cfg(fuzzing)',
] }


[workspace.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs_dep"]
rustdoc-args = [
    "--cfg",
    "docsrs_dep",
    "--html-after-content",
    "docs-rs/trait-tags.html",
    "--html-after-content",
    "docs-rs/arborium-header.html",
]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

# --- Profile Settings ---

[profile.release]
debug = "line-tables-only"

# decoding packets takes forever if we don't do this
[profile.dev.package.azalea-crypto]
opt-level = 3
[profile.dev.package.cfb8]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
